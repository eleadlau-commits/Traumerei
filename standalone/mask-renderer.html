<style>
/* Folio base styles: colours, the app frame, and the building blocks every feature shares
   (buttons, inputs, pop-up windows, switches, messages). Features add their own styles
   in their folder; the compiler puts this file first and each feature's styles after it.
   The accent colour comes from app/app.json ("theme"). */

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --text: #151925;
  --muted: #5f6678;
  --line: #dfe2eb;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --shadow: 0 1px 2px rgb(16 20 32 / .05), 0 6px 18px rgb(16 20 32 / .06);
  --radius: 14px;
  /* Corner shapes, from large to small. An app can give them uneven corners in app/theme.css
     (e.g. a "knife" shape: three small corners and one large one). */
  --shape: var(--radius);        /* cards, pop-up windows, "Missing content" boxes */
  --shape-btn: 12px;             /* buttons, text boxes, switches between choices, the selected tab */
  --shape-sm: 10px;              /* small tags, pills and icon tiles */
  /* Used by the frame. app/theme.css can change any of these. */
  --text-2: var(--text);
  --top: #1d2130;           /* the dark area: the top of the menu, and view titles that ask for it */
  --top-2: #262b3d;
  --on-top: #ffffff;
  --on-top-muted: #c3c8d6;
  --tab-ink: var(--muted);  /* tabs that aren't selected */
  --glow: var(--accent);    /* the line above the selected tab */
  --gutter: 16px;           /* space at the screen's sides */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-2: #232733;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --line: #2c313e;
    --accent: #8c9eff;
    --accent-ink: #0f1117;
    --accent-soft: #252c4d;
    --danger: #ff8a80;
    --danger-soft: #3a1f22;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
    --top: #0b0d12;
    --top-2: #111520;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font);
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

code {
  font: 0.88em var(--font-mono);
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 5px;
}

h1, h2, h3 { margin: 0; line-height: 1.2; }

/* ---- App frame ---- */

.app {
  max-width: 560px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
.app:has(> .tabbar[hidden]) { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

/* On a wide screen (a laptop or desktop) the page uses the width: a wider frame, roomier sides,
   and the tab bar a comfortable width in the middle instead of stretched. */
@media (min-width: 900px) {
  :root { --gutter: 32px; }
  .app { max-width: 1440px; }
  .tabbar { max-width: 640px; border-radius: var(--shape) var(--shape) 0 0; }
}

/* The top bar: menu on the left; other features' buttons, then account and settings, on the right.
   The bar itself is invisible: only its buttons show, each on a small frosted tile so it stays
   readable over whatever is under it. */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) var(--gutter) 6px;
  background: transparent;
  color: var(--text);
  pointer-events: none; /* only the buttons take clicks, not the space between them */
}
.topbar > * { pointer-events: auto; }
.top-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--shape-btn);
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
  color: var(--text);
  cursor: pointer;
}
.top-btn svg { width: 24px; height: 24px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.top-actions { display: flex; gap: 8px; }
.top-actions:empty { display: none; }
.top-btn.top-action { margin: 0; }
.top-btn.top-action svg { width: 22px; height: 22px; }
.top-btn.account { margin: 0; }
.top-btn.account svg { width: 24px; height: 24px; }
.top-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

main, .view-host { flex: 1; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; }
.screen-host { padding: 0 var(--gutter); }

/* Each view's title. Views can add more there (mount's `head`). It's on the page, or on the
   dark area for views that ask for that (darkHead). */
.page-head { position: relative; padding: 22px var(--gutter) 0; color: var(--text); }
.dark-head .page-head {
  padding: 6px var(--gutter) 18px;
  background: linear-gradient(180deg, var(--top), var(--top-2));
  color: var(--on-top);
}
.dark-head .page-head::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  height: 24px;
  background: linear-gradient(180deg, var(--top-2), var(--bg));
  pointer-events: none;
}
.page-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-title h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.page-sub { margin: 0; padding-bottom: 4px; font-size: 14px; color: var(--muted); text-align: right; }
.page-title h1 { margin-right: auto; }
.page-actions { display: flex; align-items: center; gap: 4px; margin: 0 -6px 0 -8px; }
.page-actions:empty { display: none; }
.dark-head .page-sub { color: var(--on-top-muted); }
.page-extra:empty { display: none; }
.page-title:not([hidden]) + .page-extra { margin-top: 14px; }
.page-body { position: relative; flex: 1; display: flex; flex-direction: column; padding: 18px var(--gutter) 0; }

/* The tab bar along the bottom. The selected tab is filled in the accent colour (a "pill" that
   slides between tabs), and the line above the bar glows over it. Tabs.js sets --pos (which tab,
   maybe between two while swiping), --glow-x and --shift (the bar following a finger a little). */
@property --glow-x { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: var(--surface);
  touch-action: none;
  transition: --glow-x 0.25s ease;
}
.tabbar::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent calc(var(--glow-x) - 55%), var(--glow) var(--glow-x), transparent calc(var(--glow-x) + 55%));
}
.tab-track {
  position: relative;
  display: flex;
  gap: 2px;
  transform: translateX(var(--shift, 0px));
  transition: transform 0.25s ease;
}
.tab-pill {
  position: absolute;
  top: 0;
  left: 0;
  width: calc((100% - (var(--tabs) - 1) * 2px) / var(--tabs));
  height: 100%;
  border-radius: var(--shape-btn);
  background: var(--accent);
  transform: translateX(calc(var(--pos, 0) * (100% + 2px)));
  transition: transform 0.25s cubic-bezier(.2, .8, .2, 1);
}
.tabbar.dragging, .tabbar.dragging .tab-track, .tabbar.dragging .tab-pill { transition: none; }
.tab {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 0;
  border-radius: var(--shape-btn);
  background: transparent;
  color: var(--tab-ink);
  font: inherit;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.15s;
}
.tab svg { width: 22px; height: 22px; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.lit { color: var(--accent-ink); font-weight: 600; }

/* The menu: a panel that slides in from the left, over most of the screen. The rest is dimmed. */
dialog.menu-drawer {
  position: fixed;
  inset: 0 auto 0 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: hidden;
}
.menu-drawer::backdrop { background: rgb(0 0 0 / .45); opacity: 0; transition: opacity 0.28s ease; }
.menu-drawer.shown::backdrop { opacity: 1; }
.menu-panel {
  width: min(85vw, 476px);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: var(--shape);
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 60px rgb(0 0 0 / .25);
  overflow-y: auto;
  overscroll-behavior: contain;
  transform: translateX(-100%);
  transition: transform 0.28s cubic-bezier(.2, .8, .2, 1);
  touch-action: pan-y;
  outline: none;
}
.menu-drawer.shown .menu-panel { transform: none; }
.menu-drawer.dragging .menu-panel { transition: none; }

/* The top of the menu: who is signed in, and the status line, on the dark area */
.menu-top {
  width: 100%;
  border: 0;
  font: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: calc(22px + env(safe-area-inset-top)) 20px 20px;
  background: linear-gradient(180deg, var(--top), var(--top-2));
  color: var(--on-top);
}
.menu-avatar {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgb(255 255 255 / .14);
}
.menu-avatar svg { width: 26px; height: 26px; }
.menu-who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.menu-top:focus-visible { outline: 2px solid var(--glow); outline-offset: -4px; }
.menu-who b { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.menu-who small { font-size: 13px; color: var(--on-top-muted); }
.menu-list { display: grid; padding: 8px 12px calc(16px + env(safe-area-inset-bottom)); }
.menu-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 8px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}
.menu-row:last-child { border-bottom: 0; }
.menu-row svg { width: 22px; height: 22px; color: var(--accent); }
.menu-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--shape-btn); }
.menu-row.spin svg { animation: spin 0.9s linear infinite; }

/* Round buttons */
.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--shape-btn);
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.icon-btn.ghost { background: transparent; box-shadow: none; width: 32px; height: 40px; color: var(--muted); }
.icon-btn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Switch between a few choices (e.g. Day · Week · Upcoming) */
.seg {
  display: grid;
  grid-template-columns: repeat(var(--tabs, 3), 1fr);
  gap: 4px;
  padding: 3px;
  border-radius: var(--shape-btn);
  background: var(--surface-2);
}
.seg button {
  height: 34px;
  border: 0;
  border-radius: var(--shape-btn);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.page-head .seg { background: var(--surface); }
.dark-head .page-head .seg { background: rgb(255 255 255 / .10); }
.dark-head .page-head .seg button { color: var(--on-top-muted); }
.page-head .seg button[aria-selected="true"] { color: var(--accent-ink); }

/* Something with nothing to show yet (ui.missing) */
.missing {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 14px 16px;
  border: 1.5px dashed var(--line);
  border-radius: var(--shape);
  color: var(--muted);
  font-size: 13px;
}
.missing b { color: var(--text-2); font-size: 14px; font-weight: 600; }
button.missing { font: inherit; font-size: 13px; text-align: left; background: transparent; cursor: pointer; }

.link-btn {
  border: 0;
  background: none;
  padding: 4px 0;
  color: var(--accent);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.list { display: flex; flex-direction: column; gap: 10px; }

.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* ---- Panels, text and forms ---- */

.panel {
  margin-top: 12px;
  padding: 18px;
  border-radius: var(--shape);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.panel h2 { font-size: 20px; margin-bottom: 8px; }
.panel h3 { font-size: 16px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.hint.small { font-size: 13px; margin: 12px 0 0; }

.label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.field { display: flex; gap: 8px; }
input[type="url"], input[type="text"], input[type="date"], input[type="datetime-local"], select, textarea {
  flex: 1;
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--shape-btn);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 16px; /* prevents iOS zoom on focus */
}
textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
input[type="url"]:focus, input[type="text"]:focus, input[type="date"]:focus, input[type="datetime-local"]:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
}

.btn {
  padding: 12px 16px;
  border: 0;
  border-radius: var(--shape-btn);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.block { display: block; width: 100%; margin-top: 12px; }
.btn.small { padding: 7px 12px; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:disabled { opacity: 0.6; cursor: default; }

.error {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--shape-btn);
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 14px;
}

.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stack { display: grid; gap: 12px; }
.sub-head { font-size: 16px; margin-top: 8px; }

.advanced summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 4px 0; }
.advanced .hint { margin: 8px 0 10px; }

.check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

/* On/off switch */
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; z-index: 1; margin: 0; opacity: 0; cursor: pointer; }
.switch input:disabled { cursor: default; }
.slider { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 0.2s; }
.slider::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgb(0 0 0 / .3);
  transition: transform 0.2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::after { transform: translateX(18px); }
.switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Pop-up windows ---- */

dialog {
  padding: 0;
  border: 0;
  background: var(--surface);
  color: var(--text);
  overflow: auto;
  overscroll-behavior: contain;
}
dialog::backdrop { background: rgb(0 0 0 / .45); }

/* Most pop-ups fill the screen. The title bar stays at the top while the rest scrolls, and on a
   wide screen the content keeps to a readable width in the middle. */
dialog.dialog-full {
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  border-radius: 0;
  transition: transform 0.22s ease; /* springing back after a pull that didn't close it */
}
dialog.dialog-full.pulling { transition: none; }
@media (prefers-reduced-motion: reduce) {
  dialog.dialog-full { transition: none; }
}
.dialog-full .dialog-body {
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0 var(--gutter) calc(24px + env(safe-area-inset-bottom));
}
.dialog-full .dialog-head {
  position: sticky;
  top: 0;
  z-index: 1;
  align-items: center;
  margin: 0 calc(-1 * var(--gutter));
  padding: calc(10px + env(safe-area-inset-top)) 10px 10px var(--gutter);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.dialog-full .dialog-head h2 { padding-top: 0; }

/* A small box in the middle (size: 'box'), with the rest of the screen dimmed. */
dialog.dialog-box {
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  border-radius: var(--shape);
  box-shadow: 0 20px 60px rgb(0 0 0 / .25);
}
.dialog-body { display: grid; gap: 12px; padding: 18px; }
.dialog-content { display: grid; gap: 12px; }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dialog-head h2 { font-size: 20px; padding-top: 8px; overflow-wrap: anywhere; }
.dialog-body .label { margin: 0 0 -6px; }
.dialog-body .error { margin: 0; }
.dialog-body .hint { margin: 0; }
.dialog-body .hint.small { margin-top: -6px; }
.dialog-body .group { display: grid; gap: 6px; }
.dialog-body .group .label { margin: 6px 0 0; }
.dialog-body .group .label:first-child { margin-top: 0; }
.dialog-body .group .hint.small { margin: 0; }
.advanced .group { margin-top: 10px; }

/* ---- Settings window ---- */

.settings-section { display: grid; gap: 12px; }
.settings-section + .settings-section { padding-top: 16px; border-top: 1px solid var(--line); }
.settings-section .sub-head { margin-top: 0; }
.features-fold summary { font-size: 16px; }
.features-fold summary small { float: right; padding-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
.features-fold[open] summary { margin-bottom: 8px; }
.feature-list { display: grid; }
.feature-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.feature-row:last-child { border-bottom: 0; }
.feature-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.feature-text small { font-size: 13px; color: var(--muted); }
.feature-row.off .feature-text { opacity: 0.6; }
.problems { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

/* ---- Message at the bottom ---- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom)); /* above the tab bar */
  z-index: 50;
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border-radius: var(--shape-btn);
  background: var(--text);
  color: var(--bg);
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 8px);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .icon-btn.spin svg, .menu-row.spin svg { animation: none; }
  .tabbar, .tab-track, .tab-pill, .tab { transition: none; }
  .menu-panel, .menu-drawer::backdrop { transition: none; }
  .toast { transition: none; }
}

/* ---- Theme from app/app.json ---- */
:root { --accent: #5c5f66; }
@media (prefers-color-scheme: dark) { :root { --accent: #b4b7bd; } }

/* ---- app/theme.css ---- */
/* A grey theme: Folio's colours made neutral (its own are slightly blue), then the renderer's
   own colour names. Components use only these and Folio's names. The accent is in app/app.json. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #ebebed;
  --text: #1b1b1d;
  --muted: #66666c;
  --line: #dedee1;
  --accent-soft: #e7e7ea;
  --top: #2a2a2d;
  --top-2: #333336;
  --on-top-muted: #c6c6ca;

  --renderer-anchor: #d93025;   /* the anchor's crosshair on the picture */
  --renderer-contour: #ec7a12;  /* the threshold line on the Field view */
  --renderer-pass: #1d6b3c;
  --renderer-pass-soft: #e2f4e8;
  --renderer-fail: #a3201a;
  --renderer-fail-soft: #fce4e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111112;
    --surface: #1b1b1d;
    --surface-2: #262628;
    --text: #e9e9eb;
    --muted: #a0a0a6;
    --line: #313134;
    --accent-ink: #111112;
    --accent-soft: #2c2c30;
    --top: #0c0c0d;
    --top-2: #151517;

    --renderer-anchor: #ff6b5e;
    --renderer-contour: #ffa64d;
    --renderer-pass: #8fd9a8;
    --renderer-pass-soft: #1d3a27;
    --renderer-fail: #ff9a90;
    --renderer-fail-soft: #43201d;
  }
}

/* ---- feature: account (style.css) ---- */
.account-page .dialog-content { display: flex; flex-direction: column; gap: 12px; }
.account-page p { margin: 0; }
.account-who { display: flex; align-items: center; gap: 12px; }
.account-who > div { display: flex; flex-direction: column; min-width: 0; }
.account-who small { opacity: 0.7; overflow-wrap: anywhere; }
.account-photo { width: 40px; height: 40px; border-radius: 50%; }
.account-error { color: var(--danger); }

/* ---- feature: renderer (style.css) ---- */
/* Styles for Renderer. Class names start with "renderer-". Colours come from app/theme.css. */

.renderer-page { display: grid; gap: 12px; }

/* Seven views don't fit in one row in the Settings window: two rows of four. */
.renderer-tabs { grid-template-columns: repeat(4, 1fr); }

/* Advanced, in Settings: the tools folded into groups */
.renderer-advanced { display: grid; gap: 4px; }
.renderer-advanced > .hint.small { margin: 0 0 4px; }
.renderer-advanced > .btn { justify-self: start; margin-top: 8px; }
.renderer-fold { border-top: 1px solid var(--line); padding: 6px 0; }
.renderer-fold summary { padding: 6px 0; }
.renderer-fold-body { display: grid; gap: 12px; padding: 8px 0 6px; }
.renderer-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.renderer-fold-body .hint.small { margin: 0; }
.renderer-marks { font-size: 14px; }

/* The picture fills the screen edge to edge, behind the (invisible) top bar, cropped to fit. */
.renderer-stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--surface-2);
}
.renderer-stage.marked { cursor: crosshair; }
.renderer-stage[hidden] { display: none; }
.renderer-page > .error { position: relative; z-index: 1; }
.renderer-canvas, .renderer-overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.renderer-canvas { object-fit: cover; }
.renderer-overlay { pointer-events: none; }

.renderer-seed { margin: 0; color: var(--muted); font-size: 13px; }
.renderer-seed code { font-family: var(--font-mono); color: var(--text); }

.renderer-report h3 { margin: 4px 0; font-size: 15px; }
.renderer-report p { margin: 0 0 8px; font-size: 14px; color: var(--text-2); }
.renderer-attempt { border-top: 1px solid var(--line); padding: 6px 0; font-size: 13px; }
.renderer-attempt summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); }
.renderer-attempt ul { margin: 6px 0 2px; padding-left: 18px; color: var(--text-2); }
.renderer-tag { padding: 1px 7px; border-radius: var(--shape-sm); font-family: var(--font); font-size: 12px; background: var(--surface-2); color: var(--muted); }
.renderer-tag.pass { background: var(--renderer-pass-soft); color: var(--renderer-pass); }
.renderer-tag.fail { background: var(--renderer-fail-soft); color: var(--renderer-fail); }
.renderer-tag.kept { background: var(--accent); color: var(--accent-ink); }

.renderer-sliders { display: grid; gap: 12px; }
.renderer-group { margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: var(--shape); background: var(--surface); display: grid; gap: 8px; }
.renderer-group legend { padding: 0 4px; font-weight: 600; font-size: 13px; }
.renderer-slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; color: var(--text-2); }
.renderer-slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.renderer-value { font-family: var(--font-mono); color: var(--text); }
.renderer-colour input { grid-column: auto; width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: var(--shape-sm); background: none; }

/* A mode's animation layer (Plain's glow): its own canvas, often smaller than the screen, scaled up by
   the browser and blended over the picture with the mode's blend (set inline). */
.renderer-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; mix-blend-mode: screen; }
.renderer-layer[hidden] { display: none; }
.renderer-tabs[hidden], .renderer-fold[hidden], .renderer-marks[hidden] { display: none; }
.renderer-choice { grid-column: 1 / -1; }
.renderer-colour-pane { display: grid; gap: 10px; }

/* ---- feature: create (style.css) ---- */
/* Styles for Create. Class names start with "create-". The rooms page slides up over the home page,
   leaving a strip of it at the top; it is a still gradient of the picture's colours (set from
   Create.js as --create-top / --create-bottom). A room fills the screen with its own gradient
   (--room-top / --room-bottom) and its words take --room-ink. The same in light and dark mode. */

:root {
  --create-strip: calc(64px + env(safe-area-inset-top));
  --create-ease: cubic-bezier(.22, .7, .18, 1);
  --create-glow: color-mix(in srgb, rgb(var(--glow-rgb, 239 204 131) / .55) 45%, rgb(255 255 255 / .55));
  /* Every pop-up and panel: the same pale, blurred white. */
  --create-panel: rgb(var(--veil-rgb, 250 247 240) / .84);
  --create-panel-ink: var(--ink, #2b2a28);
  --create-panel-shadow: 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .1), 0 12px 40px rgb(var(--ink-rgb, 43 42 40) / .12);
}

.create {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none; /* the strip at the top stays the home page's */
  color: var(--home-ink);
  font-family: var(--home-font);
}
.create > * { pointer-events: auto; }
.create[hidden], .create [hidden] { display: none !important; }
/* While Create is open the home page's words step aside; in a dark room the menu's lines turn pale. */
.create-open .home { visibility: hidden; }
.create-dark .topbar .top-btn { color: var(--room-ink); }

/* The back arrow, top left beside the menu: home from the rooms page, the rooms from a room. */
.create-back {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  left: calc(var(--gutter) + 48px);
  width: 44px;
  height: 44px;
  padding: 10px;
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--home-ink);
  opacity: 0;
  cursor: pointer;
  transition: opacity .4s;
  -webkit-tap-highlight-color: transparent;
}
.create.up .create-back { opacity: .8; }
.create-back:is(:hover, :focus-visible) { opacity: 1; outline: none; }
.create.in-room .create-back { color: var(--room-ink); z-index: 6; }
.create-back svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

/* Plain words, as on the home page and in the menu: a hairline comes under them on hover. */
.create-word, .create-crumb, .create-mode {
  appearance: none;
  background: none;
  border: 0;
  border-radius: 0;
  margin: 0;
  padding: 6px 2px;
  font: inherit;
  font-size: 13px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: inherit;
  opacity: .66;
  cursor: pointer;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity .2s, background-size .25s;
  -webkit-tap-highlight-color: transparent;
}
:is(.create-word, .create-crumb, .create-mode):is(:hover, :focus-visible),
.create-word[aria-current], .create-mode[aria-checked="true"] {
  opacity: 1;
  background-size: calc(100% - 4px - .22em) 1px;
  outline: none;
}

/* ---- The rooms page ---- */

.create-rooms {
  position: absolute;
  top: var(--create-strip);
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  /* An opacity mask over the home picture itself, which is held still underneath. */
  background: var(--create-mask, rgb(var(--ink-rgb, 43 42 40) / .1));
  box-shadow: 0 -1px 0 rgb(var(--ink-rgb, 43 42 40) / .08), 0 -18px 40px rgb(var(--ink-rgb, 43 42 40) / .08);
  transform: translateY(100%);
  transition: transform .5s var(--create-ease);
}
.create.up .create-rooms { transform: none; transition-duration: .6s; }

.create-grid-wrap { flex: 1; overflow: auto; padding: 32px var(--gutter) 64px calc(var(--gutter) + 72px); position: relative; z-index: 1; }
/* The rooms page is a grid of square cells. Rooms are opacity squares laid on it (Messy thoughts
   takes four, at the top left); an empty cell shows a faint + on hover and makes a room there. */
.create-grid {
  --cell: 120px;
  --cell-gap: 14px;
  display: grid;
  grid-template-columns: repeat(var(--cols, 6), var(--cell));
  grid-auto-rows: var(--cell);
  gap: var(--cell-gap);
  width: max-content;
  margin: 0 auto;
  position: relative;
}
.create-cell {
  appearance: none;
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .035);
  transition: box-shadow .3s, background-color .3s;
  display: grid;
  place-items: center;
  font: 300 22px/1 var(--home-font, inherit);
}
.create-cell::after { content: '+'; opacity: 0; transition: opacity .3s; }
.create-cell:is(:hover, :focus-visible) { outline: none; background: rgb(var(--ink-rgb, 43 42 40) / .03); box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .14); }
.create-cell:is(:hover, :focus-visible)::after { opacity: .5; }
.create-grid.dragging .create-cell::after { content: ''; }
.create-drop { pointer-events: none; z-index: 1; background: rgb(var(--ink-rgb, 43 42 40) / .06); box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .4); }
.create-drop.taken { background: none; box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .15); }
.create-cell.target { background: rgb(var(--ink-rgb, 43 42 40) / .05); box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .3); }

/* A room: one colour at one alpha over the page (look.js squareLook). Lit, it glows. */
.create-tile {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--square);
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  transition: box-shadow .5s, transform .3s var(--create-ease), opacity .3s;
}
.create-tile:focus-visible { outline: 1px solid var(--home-ink); outline-offset: 2px; }
.create-tile:hover { transform: translateY(-2px); }
/* Lit as much as you have been in it lately (--lit, 0 to 1). */
.create-tile.lit {
  box-shadow:
    0 0 calc(12px + 40px * var(--lit)) calc(2px * var(--lit)) color-mix(in srgb, var(--create-glow) calc(min(1, var(--lit) * 1.8) * 100%), transparent),
    inset 0 0 32px color-mix(in srgb, var(--create-glow-in, color-mix(in srgb, rgb(var(--glow-rgb, 239 204 131) / .35) 30%, rgb(255 255 255 / .35))) calc(min(1, var(--lit) * 1.8) * 100%), transparent);
}
.create-tile.deep { color: var(--pale, #f1e8d2); } /* a deep square: pale words */
.create-tile.dragging { z-index: 2; transition: none; opacity: .85; cursor: grabbing; }
.create-tile-label {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 9px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.create-tile.messy .create-tile-label { left: 14px; bottom: 13px; font-size: 12px; }
.create-tile-name { opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.create-tile-count { opacity: .5; letter-spacing: .08em; }
.create-name-field {
  width: 100%;
  min-width: 0;
  background: transparent;
  border: 0;
  border-bottom: 1px solid currentColor;
  border-radius: 0;
  padding: 2px 0;
  font: inherit;
  letter-spacing: inherit;
  text-transform: none;
  color: inherit;
  outline: none;
  box-shadow: none;
}


/* ---- A room ---- */

.create-room {
  position: absolute;
  inset: 0;
  background: linear-gradient(var(--room-top), var(--room-bottom));
  color: var(--room-ink);
  user-select: none;
  -webkit-user-select: none;
  animation: create-in .45s ease both;
}
@keyframes create-in { from { opacity: 0; } }
.create-stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: default; }
@media (hover: none) { .create-stage { cursor: grab; } }
.create-stage.panning { cursor: grab; }
.create-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* A room's rail, where the rooms page has Rooms and Archive: its modes, and Timeline under Joyce. */
.create-room .create-modes { top: calc(var(--create-strip) + 32px); z-index: 3; }
.create-rail-fixed { cursor: default; }
.create-rail-sub { margin-top: -10px; padding-left: 20px; font-size: 9px; }
.create-rail-sub[aria-pressed="true"] { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.create-room .create-history { left: calc(var(--gutter) + 72px); }
.create-top {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top) + 46px); /* under the search bar */
  left: 50%;
  transform: translateX(-50%);
  max-width: 40vw;
}
.create-crumb-name { opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.create-crumb-name .create-name-field { width: 18ch; letter-spacing: .1em; }

/* Add: one word at the bottom left, which unfolds upwards to the templates and the room's settings. */
.create-add { position: absolute; left: calc(var(--gutter) + 12px); bottom: calc(18px + env(safe-area-inset-bottom)); }
.create-add-btn { display: inline-flex; align-items: baseline; gap: 8px; }
.create-add-plus { display: inline-block; font-weight: 300; transition: transform .3s var(--create-ease); }
.create-add-btn.open .create-add-plus { transform: rotate(45deg); }
.create-add-menu {
  position: absolute;
  left: -12px;
  bottom: calc(100% + 10px);
  display: grid;
  min-width: 300px;
  padding: 8px 0;
  background: var(--create-panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--create-panel-shadow);
  color: var(--create-panel-ink);
  --room-ink: var(--create-panel-ink);
  animation: create-unfold .22s var(--create-ease) both;
}
@keyframes create-unfold { from { opacity: 0; transform: translateY(6px); } }
.create-add-item {
  appearance: none;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 18px;
  padding: 8px 16px;
  text-align: left;
  font-size: 13px;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor: pointer;
}
.create-add-item:is(:hover, :focus-visible) { outline: none; background: color-mix(in srgb, var(--room-ink) 7%, transparent); }
.create-add-note { font-size: 11px; letter-spacing: .04em; text-transform: none; opacity: .5; }
.create-add-rule { height: 1px; margin: 6px 16px; background: color-mix(in srgb, var(--room-ink) 14%, transparent); }

/* A slider or colour in a pop-up. */
.create-slider { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
.create-slider span { opacity: .6; }
.create-slider input[type="range"] { width: 120px; accent-color: var(--room-ink); }
.create-slider input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid color-mix(in srgb, var(--room-ink) 30%, transparent); border-radius: 0; background: none; flex: none; }

/* The hidden box the keys go into: in view (so a phone shows its keyboard), but unseen. */
.create-input {
  position: fixed;
  left: 50%;
  bottom: 0;
  width: 1px;
  height: 1px;
  min-height: 0;
  padding: 0;
  border: 0;
  opacity: 0;
  resize: none;
  pointer-events: none;
}

/* Thoughts. Joyce: each thought on its own, joined to the next by a line (the SVG under them):
   taut between quick thoughts, slack after a pause. */
.create-box { position: absolute; pointer-events: none; z-index: 2; background: color-mix(in srgb, var(--room-ink) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--room-ink) 45%, transparent); }
.create-stage:has(.create-box) { cursor: crosshair; }
.create-strands { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.create-strand-line { fill: none; stroke: currentColor; stroke-width: 1; opacity: .32; transition: opacity .3s; }
.create-strand-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: grab; }
.create-knot { fill: currentColor; opacity: .45; }
.create-strand.selected .create-strand-line { opacity: .7; stroke-width: 1.4; }
.create-strand.selected .create-knot { opacity: .85; }
.create-strand:hover .create-strand-line { opacity: .55; }
.create-bead {
  position: absolute;
  width: max-content;
  max-width: 380px;
  font-size: 18px;
  line-height: 1.6;
  letter-spacing: .02em;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  transition: text-shadow .3s;
}
.create-bead:hover { text-shadow: 0 0 1px color-mix(in srgb, var(--room-ink) 30%, transparent); }
.create-bead .create-passage, .create-bead .create-picture { margin: 0; }
.create-bead.selected, .create-float.selected { outline: 1px solid color-mix(in srgb, var(--room-ink) 40%, transparent); outline-offset: 7px; }
.create-bead.found, .create-float.found { animation: create-found 2.4s ease both; }
@keyframes create-found { 0%, 60% { background: color-mix(in srgb, var(--room-ink) 12%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--room-ink) 12%, transparent); } }

/* The timeline: a list down the left of everything written in the room, latest at the bottom. */
.create-history {
  position: absolute;
  left: 0;
  top: calc(92px + env(safe-area-inset-top));
  bottom: calc(64px + env(safe-area-inset-bottom));
  width: min(320px, 78vw);
  display: flex;
  flex-direction: column;
  background: var(--create-panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--create-panel-shadow);
  color: var(--create-panel-ink);
  --room-ink: var(--create-panel-ink);
  animation: create-slide-in .3s var(--create-ease) both;
  z-index: 2;
}
@keyframes create-slide-in { from { opacity: 0; transform: translateX(-12px); } }
.create-history-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 14px 18px 10px calc(var(--gutter) + 12px);
  font-size: 12px;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.create-history-head > span { opacity: .6; }
.create-history-close { appearance: none; border: 0; background: none; color: inherit; font: inherit; font-size: 20px; line-height: 1; cursor: pointer; opacity: .55; }
.create-history-close:hover { opacity: 1; }
.create-history-list { list-style: none; margin: 0; padding: 0 0 12px; overflow: auto; flex: 1; scrollbar-width: thin; }
.create-history-item {
  appearance: none;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  width: 100%;
  display: grid;
  gap: 4px;
  padding: 10px 18px 10px calc(var(--gutter) + 12px);
  text-align: left;
  cursor: pointer;
  box-shadow: inset 2px 0 0 transparent;
}
.create-history-item:is(:hover, :focus-visible) { outline: none; background: color-mix(in srgb, var(--room-ink) 6%, transparent); }
.create-history-item.on { box-shadow: inset 2px 0 0 var(--tag); background: color-mix(in srgb, var(--room-ink) 5%, transparent); }
.create-history-meta { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.create-history-time { flex: none; font-size: 11px; letter-spacing: .06em; opacity: .5; }
.create-history-text { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.create-history-none { margin: 0; padding: 10px 18px 10px calc(var(--gutter) + 12px); font-size: 13px; opacity: .5; }
.create-tag {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 1px 7px;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--tag);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tag) 45%, transparent);
}

/* Editing what is chosen: the rooms page's pop-up, beside the thought or train. */
.create-edit { width: 260px; }
.create-edit-text, .create-edit-body, .create-edit-move {
  font: inherit;
  font-size: 15px;
  letter-spacing: .01em;
  color: inherit;
  background: none;
  border: 0;
  border-bottom: 1px solid rgb(var(--ink-rgb, 43 42 40) / .25);
  border-radius: 0;
  padding: 4px 0;
  min-height: 0;
  outline: none;
  box-shadow: none;
  width: 100%;
  box-sizing: border-box;
}
.create-edit-body { resize: vertical; line-height: 1.5; font-size: 14px; }
.create-edit-lines { resize: none; overflow: hidden; line-height: 1.5; display: block; }
.create-thought { white-space: pre-line; }
.create-edit-text:focus, .create-edit-body:focus { border-bottom-color: currentColor; }
.create-edit-move { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; appearance: none; -webkit-appearance: none; padding-right: 18px;
  background: linear-gradient(45deg, transparent 50%, currentColor 50%) right 6px center / 5px 5px no-repeat, linear-gradient(-45deg, transparent 50%, currentColor 50%) right 1px center / 5px 5px no-repeat; }
.create-options-note { font-size: 12px; letter-spacing: .06em; opacity: .55; }


.create-draft { opacity: 1; }
.create-draft::after {
  content: "";
  display: inline-block;
  width: 1px;
  height: 1.05em;
  margin-left: 2px;
  vertical-align: -.15em;
  background: currentColor;
  animation: create-caret 1.1s steps(1) infinite;
}
.create-draft:empty::after { margin-left: 0; }
@keyframes create-caret { 50% { opacity: 0; } }

/* Pessoa: each thought floats on its own, centred on its place. */
.create-float {
  position: absolute;
  transform: translate(-50%, -50%);
  max-width: 260px;
  width: max-content;
  text-align: center;
  font-size: 16px;
  line-height: 1.45;
  letter-spacing: .02em;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}

/* In a dark room the words glow faintly, like a lit window. */
.create-room.dark :is(.create-bead, .create-float) { text-shadow: 0 0 16px rgb(var(--glow-rgb, 239 204 131) / .3); }

@media (max-width: 560px) {
  .create-search-btn { left: calc(var(--gutter) + 104px); transform: none; width: calc(100% - 2 * var(--gutter) - 104px); }
  .create-top { top: calc(10px + env(safe-area-inset-top) + 48px); left: calc(var(--gutter) + 12px); transform: none; max-width: calc(100% - 2 * var(--gutter) - 24px); }
}

/* Bigger thoughts. In a Joyce train they stand as blocks between the lines of words. */
.create-passage, .create-picture { display: block; margin: 12px 0; text-shadow: none; }
.create-passage {
  max-width: 380px;
  padding: 2px 0 2px 14px;
  border-left: 1px solid color-mix(in srgb, var(--room-ink) 45%, transparent);
  font-size: 15px;
  line-height: 1.6;
  text-align: left;
}
.create-passage-title { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; opacity: .85; margin-bottom: 4px; }
.create-passage-body { white-space: pre-line; opacity: .9; max-height: 22em; overflow: hidden; }
.create-passage.folded { border-left-style: dotted; }
.create-picture img { display: block; max-width: 240px; max-height: 240px; width: auto; height: auto; opacity: .92; pointer-events: none; }
.create-picture figcaption { margin-top: 6px; font-size: 13px; opacity: .7; }
.create-float .create-passage { margin: 0; }
.create-float .create-picture { margin: 0; display: grid; justify-items: center; }

/* The sheet for writing a passage or captioning a picture. */
.create-sheet {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 2 * var(--gutter)));
  max-height: calc(100% - 160px);
  overflow: auto;
  box-sizing: border-box;
  display: grid;
  gap: 16px;
  padding: 26px 28px 18px;
  background: var(--create-panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--create-panel-shadow);
  color: var(--create-panel-ink);
  --room-ink: var(--create-panel-ink);
  animation: create-in .35s ease both;
}
.create-sheet-kind { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; opacity: .45; }
.create-sheet-title, .create-sheet-body {
  width: 100%;
  box-sizing: border-box;
  background: transparent;
  border: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--room-ink) 25%, transparent);
  border-radius: 0;
  padding: 8px 0;
  font: inherit;
  color: inherit;
  outline: none;
  box-shadow: none;
  border-width: 0 0 1px;
}
.create-sheet-title { font-size: 18px; letter-spacing: .04em; }
.create-sheet-body { font-size: 15px; line-height: 1.6; resize: vertical; min-height: 9em; }
:is(.create-sheet-title, .create-sheet-body):focus { border-bottom-color: color-mix(in srgb, var(--room-ink) 45%, transparent); outline: none; }
:is(.create-sheet-title, .create-sheet-body)::placeholder { color: inherit; opacity: .4; }
.create-sheet-picture { display: block; max-width: 100%; max-height: 320px; margin: 0 auto; }
.create-sheet-words { display: flex; align-items: baseline; gap: 22px; }
.create-bar-action { opacity: .5; }
.create-sheet-preview { white-space: pre-line; font-size: 15px; line-height: 1.6; opacity: .7; max-height: 14em; overflow: auto; }

/* Settings → Rooms */
.create-settings { display: grid; gap: 12px; }
.create-settings .btn { justify-self: start; }

/* The rooms page: a square shows its outline on hover; chosen, its options stand beside it. */
.create-tile::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .25s; }
.create-tile:hover::after { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--home-ink, var(--ink, #2b2a28)) 55%, transparent); }
.create-tile.chosen::after { box-shadow: inset 0 0 0 1px var(--home-ink, var(--ink, #2b2a28)); }
.create-options {
  position: absolute;
  z-index: 3;
  display: grid;
  gap: 10px;
  width: 236px;
  padding: 14px 16px;
  background: var(--create-panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--create-panel-shadow);
  color: var(--create-panel-ink);
  --room-ink: var(--create-panel-ink);
  animation: create-unfold .2s var(--create-ease) both;
}
.create-options-name {
  font: inherit;
  font-size: 13px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: inherit;
  background: none;
  border: 0;
  border-bottom: 1px solid rgb(var(--ink-rgb, 43 42 40) / .25);
  border-radius: 0;
  padding: 4px 0;
  min-height: 0;
  outline: none;
  box-shadow: none;
}
.create-options-name:focus { border-bottom-color: currentColor; }
.create-options .create-word { justify-self: start; }
.create-options-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.create-options-label { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .6; }
.create-options .create-word[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 6px; }
.create-keep .create-word[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 6px; opacity: 1; }
.create-sheet .create-keep { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.create-options-delete { opacity: .6; }
.create-options-delete:hover { color: #8a2f22; opacity: 1; }
.create-options .create-slider input[type="range"] { width: 110px; }

/* Search (Ctrl+K): a quiet panel near the top. */
.create-search { position: fixed; inset: 0; z-index: 20; pointer-events: auto; background: rgb(var(--ink-rgb, 43 42 40) / .08); }
.create-search-panel {
  position: absolute;
  left: 50%;
  top: 14vh;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 2 * var(--gutter)));
  background: rgb(var(--veil-rgb, 250 247 240) / .9);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .1), 0 18px 60px rgb(var(--ink-rgb, 43 42 40) / .16);
  color: var(--home-ink, var(--ink, #2b2a28));
  animation: create-unfold .2s var(--create-ease) both;
}
.create-search-field {
  width: 100%;
  box-sizing: border-box;
  padding: 18px 20px;
  font: inherit;
  font-size: 17px;
  letter-spacing: .02em;
  color: inherit;
  background: none;
  border: 0;
  border-bottom: 1px solid rgb(var(--ink-rgb, 43 42 40) / .12);
  border-radius: 0;
  outline: none;
  box-shadow: none;
  min-height: 0;
}
.create-search-list { max-height: 50vh; overflow: auto; }
.create-search-item {
  appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  display: flex; justify-content: space-between; align-items: baseline; gap: 20px; width: 100%; padding: 11px 20px; text-align: left;
}
.create-search-item.on, .create-search-item:hover { background: rgb(var(--ink-rgb, 43 42 40) / .06); }
.create-search-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.create-search-room { flex: none; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .5; }
.create-search-none { margin: 0; padding: 14px 20px; font-size: 13px; opacity: .5; }

/* A quiet "Saved", and a line of help the first time a page is seen. */
.create-saved {
  position: fixed;
  right: calc(var(--gutter) + 12px);
  bottom: calc(20px + env(safe-area-inset-bottom));
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  color: var(--room-ink, var(--home-ink, var(--ink, #2b2a28)));
}
.create:not(.in-room) .create-saved { color: var(--home-ink, var(--ink, #2b2a28)); }
.create-saved.on { animation: create-saved 2.2s ease both; }
@keyframes create-saved { 10%, 60% { opacity: .45; } 100% { opacity: 0; } }
.create-hint {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  transform: translate(-50%, 6px);
  max-width: min(760px, calc(100% - 2 * var(--gutter) - 200px));
  text-align: center;
  font-size: 12px;
  letter-spacing: .05em;
  line-height: 1.5;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s, transform .6s var(--create-ease);
  color: var(--room-ink, var(--home-ink, var(--ink, #2b2a28)));
}
.create:not(.in-room) .create-hint { color: var(--home-ink, var(--ink, #2b2a28)); }
.create-hint.on { opacity: .6; transform: translate(-50%, 0); }
@media (max-width: 560px) {
  .create-hint { max-width: calc(100% - 2 * var(--gutter)); bottom: calc(64px + env(safe-area-inset-bottom)); }
  .create-options { width: 200px; }
}

/* The list of keys (?) */
.create-keys-panel { padding: 18px 22px 20px; }
.create-keys-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; margin: 12px 0 0; font-size: 13px; }
.create-keys-list dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; white-space: nowrap; }
.create-keys-list dd { margin: 0; opacity: .8; }

/* ---- The rooms page, step 1: peek, the last room, a half-written thought, lock, lights, Archive ---- */

/* Peek: a square's last thoughts in small, faint words, when it is hovered over (or always). */
.create-peek {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 9px;
  bottom: 30px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 11px;
  line-height: 1.35;
  letter-spacing: .02em;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
  -webkit-mask-image: linear-gradient(#000 70%, transparent);
  mask-image: linear-gradient(#000 70%, transparent);
}
.create-tile.messy .create-peek { left: 14px; right: 14px; top: 13px; bottom: 36px; font-size: 12px; gap: 5px; }
.create-tile:hover .create-peek, .create-grid.peek-always .create-peek { opacity: .72; }
.create-peek-line { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.create-peek-line:last-child { opacity: 1; }
.create-peek-line:not(:last-child) { opacity: .6; }
.create-peek-desc { font-style: italic; opacity: .8; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* The room last gone into: a soft outline of light. */
.create-tile.last::before {
  content: '';
  position: absolute;
  inset: -3px;
  pointer-events: none;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--create-glow) 90%, transparent), 0 0 18px 2px color-mix(in srgb, var(--create-glow) 70%, transparent);
  animation: create-breathe 4.5s ease-in-out infinite;
}
@keyframes create-breathe { 50% { opacity: .55; } }

/* A thought left half written there: a small dot, top right. */
.create-tile-dot {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: .75;
}

/* Locked: a thin bar along its top; it keeps its place. */
.create-tile.locked { cursor: default; }
.create-tile.locked:hover { transform: none; }
.create-tile.locked { box-shadow: inset 0 3px 0 color-mix(in srgb, currentColor 55%, transparent); }
.create-tile.locked.lit { box-shadow:
    inset 0 3px 0 color-mix(in srgb, currentColor 55%, transparent),
    0 0 calc(12px + 40px * var(--lit)) calc(2px * var(--lit)) color-mix(in srgb, var(--create-glow) calc(min(1, var(--lit) * 1.8) * 100%), transparent); }
.create-room.locked .create-add { display: none; }

/* Search lights: the rooms without the words dim; those with them show how many. */
.create-lights {
  position: absolute;
  z-index: 4;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: min(460px, calc(100% - 2 * var(--gutter)));
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 0 16px;
  background: var(--create-panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--create-panel-shadow);
  color: var(--create-panel-ink);
  animation: create-unfold .2s var(--create-ease) both;
}
.create-lights-field { flex: 1; min-width: 0; padding: 12px 0; font: inherit; font-size: 15px; color: inherit; background: none; border: 0; border-radius: 0; outline: none; box-shadow: none; min-height: 0; }
.create-lights-note { font-size: 11px; letter-spacing: .08em; opacity: .55; white-space: nowrap; }
.create-grid.lights .create-tile.unlit { opacity: .22; }
.create-grid.lights .create-tile.found .create-peek { opacity: .72; }
.create-tile-found {
  position: absolute;
  top: 7px;
  left: 8px;
  z-index: 1;
  padding: 1px 6px;
  font-size: 10px;
  letter-spacing: .05em;
  background: var(--create-panel);
  color: var(--create-panel-ink);
}
.create-grid.lights .create-tile.found .create-peek { top: 28px; }

/* The Archive: a page of its own, reached from the rail on the left. */
/* Its empty cells make nothing. */
.create-cell.inert { cursor: default; }
.create-cell.inert::after { content: none; }
.create-cell.inert:hover { background: transparent; box-shadow: inset 0 0 0 1px rgb(var(--ink-rgb, 43 42 40) / .035); }
.create-shelf-head { text-align: center; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; opacity: .6; margin: 0 0 24px; }
.create-rooms.shelf { background: color-mix(in srgb, var(--create-mask, rgb(43 42 40 / .1)) 100%, rgb(var(--ink-rgb, 43 42 40) / .12)); }
.create-rooms.shelf .create-tile { filter: saturate(.7); }

/* A room's description: under its name inside the room, and in its pop-up. */
.create-crumb-desc { margin-top: 2px; font-size: 12px; letter-spacing: .03em; font-style: italic; text-align: center; opacity: .55; max-width: 40vw; white-space: normal; }
.create-options-desc {
  font: inherit;
  font-size: 12px;
  line-height: 1.4;
  color: inherit;
  background: none;
  border: 0;
  border-bottom: 1px solid rgb(var(--ink-rgb, 43 42 40) / .15);
  border-radius: 0;
  padding: 4px 0;
  resize: none;
  min-height: 0;
  outline: none;
  box-shadow: none;
}
.create-options-desc:focus { border-bottom-color: currentColor; }
.create-edit-read { margin: 0; font-size: 13px; line-height: 1.45; white-space: pre-wrap; max-height: 40vh; overflow: auto; }

/* Going in: the square grows to fill the screen, then fades into the room. */
.create-expand {
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  z-index: 5;
  transform-origin: 0 0;
  pointer-events: none;
}
.create-expand.go { transition: transform .43s cubic-bezier(.65, 0, .25, 1); }
.create-expand.done { transition: opacity .25s ease; opacity: 0; }
.create.expanding .create-room { opacity: 0; pointer-events: none; } /* not hidden: it must take the keys typed meanwhile */
.create.expanding .create-back { color: var(--home-ink); }

/* ---- Search: a pale bar in the middle of the top row, level with the menu ---- */
.create-search-btn {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top) + 7px);
  left: 50%;
  transform: translateX(-50%);
  width: min(260px, calc(100% - 2 * var(--gutter) - 120px));
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  background: rgb(var(--veil-rgb, 250 247 240) / .55);
  background-image: none;
  opacity: 0;
  transition: opacity .4s, background-color .25s;
}
.create-search-btn > span:first-child::before { content: "⌕ "; opacity: .7; }
.create.up .create-search-btn:is(:hover, :focus-visible) { background-color: rgb(var(--veil-rgb, 250 247 240) / .8); }
.create.up .create-search-btn { opacity: .66; }
.create.up .create-search-btn:is(:hover, :focus-visible) { opacity: 1; }
.create.in-room .create-search-btn { color: var(--room-ink); z-index: 6; }
.create-search-key { font-size: 10px; letter-spacing: .08em; text-transform: none; opacity: .6; }

/* ---- The rail on the left, under the menu: Rooms and the Archive (in a room, its modes) ---- */
.create-rail {
  position: absolute;
  z-index: 2;
  top: 32px;
  left: var(--gutter);
  width: 60px;
  display: grid;
  gap: 18px;
  justify-items: start;
}
.create-rail-item {
  appearance: none;
  background: none;
  border: 0;
  border-radius: 0;
  margin: 0;
  padding: 2px 0 2px 10px;
  display: grid;
  gap: 4px;
  text-align: left;
  font: inherit;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: inherit;
  opacity: .5;
  cursor: pointer;
  box-shadow: inset 1px 0 0 transparent;
  transition: opacity .2s, box-shadow .25s;
  -webkit-tap-highlight-color: transparent;
}
.create-rail-item:is(:hover, :focus-visible) { opacity: .85; outline: none; }
.create-rail-item[aria-current="true"] { opacity: 1; box-shadow: inset 1px 0 0 currentColor; }

.create-rail-item.drop-on { opacity: 1; box-shadow: inset 2px 0 0 currentColor; }

/* ---- The pages of the rooms page: 1 2 3 + ---- */
.create-pages {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
}
.create-page { font-size: 12px; letter-spacing: .1em; padding: 4px 3px; }
.create-page.drop-on { opacity: 1; background-size: calc(100% - 4px - .1em) 1px; }

/* ---- Choosing on a grid: a click outlines a square; a right-click opens its properties ---- */
.create-tile.picked { outline: 1px solid color-mix(in srgb, var(--home-ink, var(--ink, #2b2a28)) 70%, transparent); outline-offset: 3px; }
.create-tile.dragging { pointer-events: none; }

/* A new room: its kinds, beside the empty cell. */
.create-kind {
  appearance: none;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 18px;
  padding: 7px 0;
  text-align: left;
  font-size: 13px;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: .8;
}
.create-kind:is(:hover, :focus-visible) { outline: none; opacity: 1; }
.create-kind:is(:hover, :focus-visible) .create-kind-name { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

/* Add, opened by a right-click on the canvas: there, at the pointer. */
.create-add-menu.at { position: fixed; bottom: auto; z-index: 8; }

/* On a phone the rail lies along the top of the rooms page, and the keys aren't shown. */
@media (max-width: 560px) {
  .create-rail { top: 10px; width: auto; display: flex; align-items: center; gap: 18px; }
  .create-room .create-modes { top: calc(64px + env(safe-area-inset-top)); }
  .create-rail-sub { margin: 0; padding-left: 0; }
  .create-room .create-history { left: 0; }
  .create-rail-item { display: flex; gap: 8px; align-items: baseline; padding: 2px 0 4px; box-shadow: inset 0 -1px 0 transparent; }
  .create-rail-item[aria-current="true"] { box-shadow: inset 0 -1px 0 currentColor; }
  .create-grid-wrap { padding: 48px var(--gutter) 64px; }
}
@media (hover: none) { .create-search-key { display: none; } }

/* ---- Leaving: a comment for next time, and last time's comment under the search bar ---- */
.create-leave { position: fixed; z-index: 21; color: var(--create-panel-ink); }
.create-note {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top) + 46px);
  left: 50%;
  transform: translateX(-50%);
  max-width: min(560px, calc(100% - 2 * var(--gutter)));
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-size: 13px;
  font-style: italic;
  letter-spacing: .03em;
  opacity: .6;
}
.create.in-room .create-note { display: none; }
.create-note-x { font-size: 10px; font-style: normal; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
@media (max-width: 560px) { .create-note { top: calc(10px + env(safe-area-inset-top) + 48px); } }
.create-leave .create-keys { margin-left: auto; font-size: 11px; letter-spacing: .05em; opacity: .5; }

/* ---- feature: home (style.css) ---- */
/* Styles for Home. Class names start with "home-". The words sit on the paper, so they use
   their own ink, the same in light and dark mode (the picture doesn't change with the mode). */

:root {
  --home-ink: var(--ink, #2b2a28); /* the palette's ink (Renderer: Settings → Colour) */
  --home-font: "Tenor Sans", sans-serif;
}

/* The page over the picture: the name in the middle, a little above centre. Only the words
   take clicks, so the picture underneath still can (e.g. moving the anchor). */
.home {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(28px, 5vh, 56px);
  padding: 0 24px 6vh;
  pointer-events: none;
  color: var(--home-ink);
  font-family: var(--home-font);
  text-align: center;
}
.home-font-loading .home { visibility: hidden; } /* no flash of the fallback face */

.home-title {
  margin: 0;
  font-family: inherit;
  font-weight: 400;
  font-size: clamp(36px, 8vw, 104px);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  /* Letter spacing adds space after the last letter too; this keeps the word truly centred. */
  margin-right: -0.12em;
  opacity: 0.88;
}

.home-nav { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.home-row { display: flex; gap: clamp(28px, 4vw, 48px); }

/* Plain words, not buttons: no fill, no border, no shadow. A hairline appears under the word
   on hover or focus. */
.home-link {
  pointer-events: auto;
  appearance: none;
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  margin: 0;
  padding: 6px 2px;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.22em;
  margin-right: -0.22em;
  text-transform: uppercase;
  color: inherit;
  opacity: 0.62;
  cursor: pointer;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity 0.2s, background-size 0.25s;
  -webkit-tap-highlight-color: transparent;
}
.home-link.home-create { font-size: 25px; opacity: 0.8; }
.home-link:hover, .home-link:focus-visible { opacity: 1; background-size: calc(100% - 4px - 0.22em) 1px; outline: none; }

/* The top bar: only the menu button, as the three lines alone at 80% opacity. */
.topbar .top-btn {
  background: none;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: var(--home-ink);
  opacity: 0.8;
}
.topbar .top-btn:hover { opacity: 1; }
.topbar .top-right { display: none; }

/* Settings → Typeface: each choice in its own face. */
.home-fonts button, .home-fonts button[aria-selected="true"] { font-size: 15px; font-weight: 400; }

/* ---- The menu: "Veil" ----
   No panel and no dark backdrop: when the menu opens the light comes up, the page goes pale and
   soft-focus behind a veil, and the words stand on the left in the home page's type. Who is
   signed in sits small at the bottom. The three lines become a thin cross in the same place.
   Folio's Menu still opens and closes it (tap the empty veil, Escape, back, swipe left);
   this only restyles it. Closing must finish within Menu.js's SLIDE_MS (280ms). */
:root {
  --veil-glow: color-mix(in srgb, rgb(var(--veil-rgb, 250 247 240) / .78) 55%, rgb(255 255 255 / .78));
  --veil-mid: rgb(var(--veil-rgb, 250 247 240) / .55);
  --veil-far: rgb(var(--veil-rgb, 250 247 240) / .38);
}
dialog.menu-drawer { background: transparent; color: var(--home-ink); font-family: var(--home-font); }
.menu-drawer::backdrop { background: transparent; }
dialog.menu-drawer::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(90% 80% at 18% 50%, var(--veil-glow), var(--veil-mid) 60%, var(--veil-far));
  -webkit-backdrop-filter: blur(14px) saturate(.9);
  backdrop-filter: blur(14px) saturate(.9);
  opacity: 0;
  transition: opacity .25s ease;
}
.menu-drawer.shown::before { opacity: 1; transition: opacity .7s cubic-bezier(.22, .7, .18, 1); }

.menu-drawer .menu-panel {
  position: relative;
  width: 100%;
  border-radius: 0;
  background: none;
  box-shadow: none;
  color: inherit;
  transform: none;
  justify-content: center;
  padding: calc(84px + env(safe-area-inset-top)) var(--gutter) calc(120px + env(safe-area-inset-bottom));
  padding-left: calc(var(--gutter) + 12px);
}
/* The cross, where the three lines were. Tapping it (or any empty part) closes the menu. */
.menu-drawer .menu-panel::before, .menu-drawer .menu-panel::after {
  content: "";
  position: absolute;
  top: calc(10px + env(safe-area-inset-top) + 21.4px);
  left: calc(var(--gutter) + 12px);
  width: 20px;
  height: 1.25px;
  border-radius: 1px;
  background: var(--home-ink);
  opacity: 0;
  transition: transform .25s ease, opacity .2s;
  pointer-events: none;
}
/* Once shown, the cross takes the pointer: a clear border widens the spot that shows the hand. */
.menu-drawer.shown .menu-panel::before, .menu-drawer.shown .menu-panel::after {
  pointer-events: auto;
  cursor: pointer;
  border: 10px solid transparent;
  background-clip: content-box;
  box-sizing: content-box;
  margin: -10px 0 0 -10px;
}
.menu-drawer.shown .menu-panel::before, .menu-drawer.shown .menu-panel::after {
  opacity: .8;
  transition: transform .5s cubic-bezier(.22, .7, .18, 1), opacity .3s;
}
.menu-drawer.shown .menu-panel::before { transform: rotate(45deg); }
.menu-drawer.shown .menu-panel::after { transform: rotate(-45deg); }

.menu-drawer .menu-list { display: grid; justify-items: start; gap: clamp(18px, 3.2vh, 30px); padding: 0; }
.menu-drawer .menu-row {
  padding: 6px 2px;
  border: 0;
  border-radius: 0;
  color: inherit;
  font: inherit;
  font-size: clamp(20px, 2.4vw, 26px);
  letter-spacing: .26em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(8px);
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity .2s, transform .25s, background-size .3s;
  -webkit-tap-highlight-color: transparent;
}
.menu-drawer .menu-row svg { display: none; }
.menu-drawer.shown .menu-row {
  opacity: .7;
  transform: none;
  transition: opacity .5s cubic-bezier(.22, .7, .18, 1), transform .7s cubic-bezier(.22, .7, .18, 1), background-size .3s;
}
.menu-drawer.shown .menu-row:nth-child(1) { transition-delay: .10s, .10s, 0s; }
.menu-drawer.shown .menu-row:nth-child(2) { transition-delay: .17s, .17s, 0s; }
.menu-drawer.shown .menu-row:nth-child(3) { transition-delay: .24s, .24s, 0s; }
.menu-drawer.shown .menu-row:nth-child(4) { transition-delay: .31s, .31s, 0s; }
.menu-drawer.shown .menu-row:nth-child(n+5) { transition-delay: .38s, .38s, 0s; }
.menu-drawer .menu-row:hover, .menu-drawer .menu-row:focus-visible {
  opacity: 1;
  outline: none;
  background-size: calc(100% - 4px - .26em) 1px;
}

/* Who is signed in: small, at the bottom left, under a short hairline. */
.menu-drawer .menu-top {
  position: absolute;
  left: calc(var(--gutter) + 14px);
  bottom: calc(56px + env(safe-area-inset-bottom));
  width: auto;
  padding: 18px 0 4px;
  display: grid;
  background: none;
  color: inherit;
  opacity: 0;
  transition: opacity .25s;
}
.menu-drawer.shown .menu-top { opacity: .5; transition: opacity .6s .38s; }
.menu-drawer .menu-top:hover, .menu-drawer .menu-top:focus-visible { opacity: .8; outline: none; }
.menu-drawer .menu-top::before { content: ""; position: absolute; top: 0; left: 0; width: 36px; height: 1px; background: currentColor; opacity: .5; }
.menu-drawer .menu-avatar { display: none; }
.menu-drawer .menu-who { gap: 6px; }
.menu-drawer .menu-who b, .menu-drawer .menu-who small {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: inherit;
}

/* ---- Settings, Account and About: the same "Veil" ----
   They open like the menu: no panel or box, the page goes pale and soft-focus behind a veil, and
   the page's words stand on the left in the home page's type. The thin cross top left closes them
   (as do Escape, back and the pull-down). Folio's dialogs still do the work; this only restyles
   them, mostly by giving Folio's colour tokens the veil's ink inside them. */
:is(dialog.settings-dialog, dialog.account-page, dialog.about-dialog) {
  --text: var(--home-ink);
  --text-2: rgb(var(--ink-rgb, 43 42 40) / .78);
  --muted: rgb(var(--ink-rgb, 43 42 40) / .58);
  --line: rgb(var(--ink-rgb, 43 42 40) / .14);
  --surface: transparent;
  --surface-2: rgb(var(--ink-rgb, 43 42 40) / .05);
  --accent: var(--home-ink);
  --accent-ink: var(--veil, #fbf8f1);
  --veil-ink-faint: rgb(var(--ink-rgb, 43 42 40) / .35);
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  border-radius: 0;
  box-shadow: none;
  background: transparent;
  color: var(--home-ink);
  font-family: var(--home-font);
}
:is(dialog.settings-dialog, dialog.account-page, dialog.about-dialog)::backdrop { background: transparent; }
:is(dialog.settings-dialog, dialog.account-page, dialog.about-dialog)::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(90% 80% at 18% 50%, var(--veil-glow), var(--veil-mid) 60%, var(--veil-far));
  -webkit-backdrop-filter: blur(14px) saturate(.9);
  backdrop-filter: blur(14px) saturate(.9);
  animation: veil-in .7s cubic-bezier(.22, .7, .18, 1) both;
}
/* A pale band at the top, so the words fade out as they scroll up under the cross. */
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1;
  height: calc(72px + env(safe-area-inset-top));
  background: linear-gradient(rgb(var(--veil-rgb, 250 247 240) / .9), rgb(var(--veil-rgb, 250 247 240) / .6) 50%, rgb(var(--veil-rgb, 250 247 240) / 0));
  pointer-events: none;
  animation: veil-in .7s cubic-bezier(.22, .7, .18, 1) both;
}
@keyframes veil-in { from { opacity: 0; } }
@keyframes veil-words-in { from { opacity: 0; } }
@keyframes veil-rise { from { transform: translateY(8px); } }

:is(.settings-dialog, .account-page, .about-dialog) .dialog-body {
  width: min(100%, 620px);
  margin: 0;
  padding: calc(92px + env(safe-area-inset-top)) var(--gutter) calc(72px + env(safe-area-inset-bottom));
  padding-left: calc(var(--gutter) + 12px);
  background: none;
  gap: 28px;
}
/* The words rise into place; the body itself isn't animated, so the fixed cross stays above the band. */
:is(.settings-dialog, .account-page, .about-dialog) :is(.dialog-content, .dialog-head h2) {
  animation: veil-words-in .7s .1s cubic-bezier(.22, .7, .18, 1) both, veil-rise .7s .1s cubic-bezier(.22, .7, .18, 1) both;
}
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head {
  position: static;
  margin: 0;
  padding: 0;
  background: none;
  border: 0;
}
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head h2 {
  margin: 0;
  padding: 0;
  font-family: inherit;
  font-weight: 400;
  font-size: clamp(20px, 2.4vw, 26px);
  letter-spacing: .26em;
  text-transform: uppercase;
  opacity: .8;
}
/* The close button becomes the thin cross where the three lines are. */
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn {
  position: fixed;
  z-index: 2;
  top: calc(10px + env(safe-area-inset-top));
  left: var(--gutter);
  width: 44px;
  height: 44px;
  padding: 0;
  background: none;
  box-shadow: none;
  color: var(--home-ink);
  opacity: .8;
  cursor: pointer;
}
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn:hover { opacity: 1; }
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn svg { display: none; }
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn::before,
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn::after {
  content: "";
  position: absolute;
  top: 21.4px;
  left: 12px;
  width: 20px;
  height: 1.25px;
  border-radius: 1px;
  background: currentColor;
  transform: rotate(45deg);
}
:is(.settings-dialog, .account-page, .about-dialog) .dialog-head .icon-btn::after { transform: rotate(-45deg); }

:is(.settings-dialog, .account-page, .about-dialog) .dialog-content { gap: 40px; }
.account-page .dialog-content { gap: 22px; }
:is(.settings-dialog, .about-dialog) .settings-section { gap: 16px; }
:is(.settings-dialog, .about-dialog) .settings-section + .settings-section { padding-top: 0; border-top: 0; }

/* Section names: small spaced capitals under a short hairline, like who is signed in on the menu. */
:is(.settings-dialog, .about-dialog) .sub-head {
  position: relative;
  margin: 0;
  padding-top: 14px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .26em;
  text-transform: uppercase;
  opacity: .6;
}
:is(.settings-dialog, .about-dialog) .sub-head::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 36px;
  height: 1px;
  background: currentColor;
  opacity: .5;
}

/* Small writing: the home page's face, quieter, in ordinary case. */
:is(.settings-dialog, .account-page, .about-dialog) :is(.hint, p, small) {
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: .02em;
  color: var(--muted);
}

/* Choices: plain words; the chosen one is darker with the hairline under it. */
:is(.settings-dialog, .account-page) .seg {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 26px;
  padding: 0;
  border-radius: 0;
  background: none;
}
:is(.settings-dialog, .account-page) .seg button,
:is(.settings-dialog, .account-page) .btn,
:is(.settings-dialog, .account-page) .renderer-buttons button {
  height: auto;
  min-height: 0;
  padding: 6px 2px;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: none;
  color: var(--home-ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .2em;
  margin-right: -.2em;
  text-transform: uppercase;
  opacity: .5;
  cursor: pointer;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity .2s, background-size .3s;
}
:is(.settings-dialog, .account-page) .btn { justify-self: start; align-self: flex-start; opacity: .7; }
:is(.settings-dialog, .account-page) .seg button[aria-selected="true"],
:is(.settings-dialog, .account-page) .seg button[aria-checked="true"] {
  background-color: transparent;
  color: var(--home-ink);
  font-weight: 400;
  opacity: 1;
  background-size: calc(100% - 4px - .2em) 1px;
}
:is(.settings-dialog, .account-page) :is(.seg button, .btn, .renderer-buttons button):hover,
:is(.settings-dialog, .account-page) :is(.seg button, .btn, .renderer-buttons button):focus-visible {
  opacity: 1;
  outline: none;
  background-size: calc(100% - 4px - .2em) 1px;
}
.settings-dialog .home-fonts button { letter-spacing: .14em; text-transform: none; font-size: 15px; }

/* Folds (Advanced, the layers, Features): a spaced word with + or −, no triangle. */
.settings-dialog details > summary {
  list-style: none;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  font-family: inherit;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  opacity: .75;
  cursor: pointer;
}
.settings-dialog details > summary::-webkit-details-marker { display: none; }
.settings-dialog details > summary::before { content: "+"; width: 10px; letter-spacing: 0; opacity: .7; }
.settings-dialog details[open] > summary::before { content: "−"; }
.settings-dialog details > summary:hover { opacity: 1; }
.settings-dialog .features-fold summary small { margin-left: auto; float: none; letter-spacing: .1em; text-transform: none; }
.settings-dialog .renderer-fold, .settings-dialog .renderer-attempt, .settings-dialog .feature-row { border-color: var(--line); }

/* The tools: no boxes; hairline sliders with a small ink bead. */
.settings-dialog .renderer-group { padding: 0; border: 0; background: none; gap: 14px; }
.settings-dialog .renderer-group legend {
  margin-bottom: 6px;
  padding: 0;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  opacity: .6;
}
.settings-dialog .renderer-slider { font-family: inherit; font-size: 13px; letter-spacing: .02em; color: var(--text-2); }
.settings-dialog .renderer-value { color: var(--home-ink); }
.settings-dialog input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 20px;
  margin: 0;
  background: none;
  cursor: pointer;
}
.settings-dialog input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--veil-ink-faint); }
.settings-dialog input[type="range"]::-moz-range-track { height: 1px; background: var(--veil-ink-faint); }
.settings-dialog input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  margin-top: -5px;
  border: 0;
  border-radius: 50%;
  background: var(--home-ink);
}
.settings-dialog input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--home-ink); }
.settings-dialog input[type="range"]:focus-visible { outline: none; }
.settings-dialog input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgb(var(--ink-rgb, 43 42 40) / .15); }
.settings-dialog .switch { width: 34px; height: 18px; }
.settings-dialog .switch .slider { background: none; border: 1px solid var(--veil-ink-faint); }
.settings-dialog .switch .slider::after { top: 3px; left: 3px; width: 10px; height: 10px; background: var(--veil-ink-faint); box-shadow: none; }
.settings-dialog .switch input:checked + .slider { background: none; border-color: var(--home-ink); }
.settings-dialog .switch input:checked + .slider::after { transform: translateX(16px); background: var(--home-ink); }
.settings-dialog .renderer-colour input { border-color: var(--veil-ink-faint); border-radius: 0; }

          el5("button", { type: "button", class: "create-word", onclick: keep }, "Keep"),
          el5("button", { type: "button", class: "create-word", onclick: () => this.closeSheet() }, "Cancel"),
          el5("span", { class: "create-keys" }, kind === "passage" ? "Enter keeps it · Ctrl+Enter a new line" : "Enter keeps it")
        )
      );
      this.sheet.hidden = false;
      (kind === "picture" ? this.sheetCaption : kind === "passage" && th ? this.sheetBody : this.sheetTitle).focus();
    }
    keepSheet() {
      const ed = this.editing;
      if (!ed) return;
      if (ed.kind === "group") {
        name(this.world, ed.id, this.sheetTitle.value);
        if (ed.ask) update(this.world, ed.id, { keep: ed.keep });
      } else {
        const fields = ed.kind === "passage" ? { kind: "passage", title: this.sheetTitle.value, body: this.sheetBody.value } : { kind: "picture", src: ed.src, text: this.sheetCaption.value };
        if (ed.id) update(this.world, ed.id, fields);
        else {
          const t = this.target();
          const train = t.train ? this.world.things[t.train] : startTrain(this.world, this.roomId, t.x, t.y);
          if (create(this.world, train.id, fields)) this.current[this.roomId] = train.id;
          else if (!t.train) remove(this.world, train.id);
        }
      }
      this.save();
      this.closeSheet();
      this.drawWorld();
    }
    closeSheet() {
      this.addAt = null;
      this.editing = null;
      this.sheet.hidden = true;
      this.sheet.replaceChildren();
    }
    moveTo(toRoom) {
      const v = view3(this.world, toRoom);
      const box = { x: v.x - 300, y: v.y - 160, w: 400, h: 320 };
      const taken = roomTrains(this.world, toRoom).map((t) => ({ x: t.x, y: t.y }));
      const spot2 = randomSpot(box, taken);
      const x = Math.round(spot2.x), y = Math.round(spot2.y);
      move(this.world, this.sel.id, toRoom, x, y);
      this.sel = null;
      this.save();
      this.drawWorld();
      this.toast(`Moved to ${room(this.world, toRoom).name}`);
    }
  };
