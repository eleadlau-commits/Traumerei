<style>
/* Folio base styles: colours, the app frame, and the building blocks every feature shares
   (buttons, inputs, pop-up windows, switches, messages). Features add their own styles
   in their folder; the compiler puts this file first and each feature's styles after it.
   The accent colour comes from app/app.json ("theme"). */

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --text: #151925;
  --muted: #5f6678;
  --line: #dfe2eb;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --shadow: 0 1px 2px rgb(16 20 32 / .05), 0 6px 18px rgb(16 20 32 / .06);
  --radius: 14px;
  /* Corner shapes, from large to small. An app can give them uneven corners in app/theme.css
     (e.g. a "knife" shape: three small corners and one large one). */
  --shape: var(--radius);        /* cards, pop-up windows, "Missing content" boxes */
  --shape-btn: 12px;             /* buttons, text boxes, switches between choices, the selected tab */
  --shape-sm: 10px;              /* small tags, pills and icon tiles */
  /* Used by the frame. app/theme.css can change any of these. */
  --text-2: var(--text);
  --top: #1d2130;           /* the dark area: the top of the menu, and view titles that ask for it */
  --top-2: #262b3d;
  --on-top: #ffffff;
  --on-top-muted: #c3c8d6;
  --tab-ink: var(--muted);  /* tabs that aren't selected */
  --glow: var(--accent);    /* the line above the selected tab */
  --gutter: 16px;           /* space at the screen's sides */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-2: #232733;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --line: #2c313e;
    --accent: #8c9eff;
    --accent-ink: #0f1117;
    --accent-soft: #252c4d;
    --danger: #ff8a80;
    --danger-soft: #3a1f22;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
    --top: #0b0d12;
    --top-2: #111520;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font);
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

code {
  font: 0.88em var(--font-mono);
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 5px;
}

h1, h2, h3 { margin: 0; line-height: 1.2; }

/* ---- App frame ---- */

.app {
  max-width: 560px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
.app:has(> .tabbar[hidden]) { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

/* On a wide screen (a laptop or desktop) the page uses the width: a wider frame, roomier sides,
   and the tab bar a comfortable width in the middle instead of stretched. */
@media (min-width: 900px) {
  :root { --gutter: 32px; }
  .app { max-width: 1440px; }
  .tabbar { max-width: 640px; border-radius: var(--shape) var(--shape) 0 0; }
}

/* The top bar: menu on the left; other features' buttons, then account and settings, on the right.
   The bar itself is invisible: only its buttons show, each on a small frosted tile so it stays
   readable over whatever is under it. */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) var(--gutter) 6px;
  background: transparent;
  color: var(--text);
  pointer-events: none; /* only the buttons take clicks, not the space between them */
}
.topbar > * { pointer-events: auto; }
.top-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--shape-btn);
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
  color: var(--text);
  cursor: pointer;
}
.top-btn svg { width: 24px; height: 24px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.top-actions { display: flex; gap: 8px; }
.top-actions:empty { display: none; }
.top-btn.top-action { margin: 0; }
.top-btn.top-action svg { width: 22px; height: 22px; }
.top-btn.account { margin: 0; }
.top-btn.account svg { width: 24px; height: 24px; }
.top-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

main, .view-host { flex: 1; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; }
.screen-host { padding: 0 var(--gutter); }

/* Each view's title. Views can add more there (mount's `head`). It's on the page, or on the
   dark area for views that ask for that (darkHead). */
.page-head { position: relative; padding: 22px var(--gutter) 0; color: var(--text); }
.dark-head .page-head {
  padding: 6px var(--gutter) 18px;
  background: linear-gradient(180deg, var(--top), var(--top-2));
  color: var(--on-top);
}
.dark-head .page-head::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  height: 24px;
  background: linear-gradient(180deg, var(--top-2), var(--bg));
  pointer-events: none;
}
.page-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-title h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.page-sub { margin: 0; padding-bottom: 4px; font-size: 14px; color: var(--muted); text-align: right; }
.page-title h1 { margin-right: auto; }
.page-actions { display: flex; align-items: center; gap: 4px; margin: 0 -6px 0 -8px; }
.page-actions:empty { display: none; }
.dark-head .page-sub { color: var(--on-top-muted); }
.page-extra:empty { display: none; }
.page-title:not([hidden]) + .page-extra { margin-top: 14px; }
.page-body { position: relative; flex: 1; display: flex; flex-direction: column; padding: 18px var(--gutter) 0; }

/* The tab bar along the bottom. The selected tab is filled in the accent colour (a "pill" that
   slides between tabs), and the line above the bar glows over it. Tabs.js sets --pos (which tab,
   maybe between two while swiping), --glow-x and --shift (the bar following a finger a little). */
@property --glow-x { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: var(--surface);
  touch-action: none;
  transition: --glow-x 0.25s ease;
}
.tabbar::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent calc(var(--glow-x) - 55%), var(--glow) var(--glow-x), transparent calc(var(--glow-x) + 55%));
}
.tab-track {
  position: relative;
  display: flex;
  gap: 2px;
  transform: translateX(var(--shift, 0px));
  transition: transform 0.25s ease;
}
.tab-pill {
  position: absolute;
  top: 0;
  left: 0;
  width: calc((100% - (var(--tabs) - 1) * 2px) / var(--tabs));
  height: 100%;
  border-radius: var(--shape-btn);
  background: var(--accent);
  transform: translateX(calc(var(--pos, 0) * (100% + 2px)));
  transition: transform 0.25s cubic-bezier(.2, .8, .2, 1);
}
.tabbar.dragging, .tabbar.dragging .tab-track, .tabbar.dragging .tab-pill { transition: none; }
.tab {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 0;
  border-radius: var(--shape-btn);
  background: transparent;
  color: var(--tab-ink);
  font: inherit;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.15s;
}
.tab svg { width: 22px; height: 22px; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.lit { color: var(--accent-ink); font-weight: 600; }

/* The menu: a panel that slides in from the left, over most of the screen. The rest is dimmed. */
dialog.menu-drawer {
  position: fixed;
  inset: 0 auto 0 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: hidden;
}
.menu-drawer::backdrop { background: rgb(0 0 0 / .45); opacity: 0; transition: opacity 0.28s ease; }
.menu-drawer.shown::backdrop { opacity: 1; }
.menu-panel {
  width: min(85vw, 476px);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: var(--shape);
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 60px rgb(0 0 0 / .25);
  overflow-y: auto;
  overscroll-behavior: contain;
  transform: translateX(-100%);
  transition: transform 0.28s cubic-bezier(.2, .8, .2, 1);
  touch-action: pan-y;
  outline: none;
}
.menu-drawer.shown .menu-panel { transform: none; }
.menu-drawer.dragging .menu-panel { transition: none; }

/* The top of the menu: who is signed in, and the status line, on the dark area */
.menu-top {
  width: 100%;
  border: 0;
  font: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: calc(22px + env(safe-area-inset-top)) 20px 20px;
  background: linear-gradient(180deg, var(--top), var(--top-2));
  color: var(--on-top);
}
.menu-avatar {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgb(255 255 255 / .14);
}
.menu-avatar svg { width: 26px; height: 26px; }
.menu-who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.menu-top:focus-visible { outline: 2px solid var(--glow); outline-offset: -4px; }
.menu-who b { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.menu-who small { font-size: 13px; color: var(--on-top-muted); }
.menu-list { display: grid; padding: 8px 12px calc(16px + env(safe-area-inset-bottom)); }
.menu-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 8px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}
.menu-row:last-child { border-bottom: 0; }
.menu-row svg { width: 22px; height: 22px; color: var(--accent); }
.menu-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--shape-btn); }
.menu-row.spin svg { animation: spin 0.9s linear infinite; }

/* Round buttons */
.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--shape-btn);
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.icon-btn.ghost { background: transparent; box-shadow: none; width: 32px; height: 40px; color: var(--muted); }
.icon-btn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Switch between a few choices (e.g. Day · Week · Upcoming) */
.seg {
  display: grid;
  grid-template-columns: repeat(var(--tabs, 3), 1fr);
  gap: 4px;
  padding: 3px;
  border-radius: var(--shape-btn);
  background: var(--surface-2);
}
.seg button {
  height: 34px;
  border: 0;
  border-radius: var(--shape-btn);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.page-head .seg { background: var(--surface); }
.dark-head .page-head .seg { background: rgb(255 255 255 / .10); }
.dark-head .page-head .seg button { color: var(--on-top-muted); }
.page-head .seg button[aria-selected="true"] { color: var(--accent-ink); }

/* Something with nothing to show yet (ui.missing) */
.missing {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 14px 16px;
  border: 1.5px dashed var(--line);
  border-radius: var(--shape);
  color: var(--muted);
  font-size: 13px;
}
.missing b { color: var(--text-2); font-size: 14px; font-weight: 600; }
button.missing { font: inherit; font-size: 13px; text-align: left; background: transparent; cursor: pointer; }

.link-btn {
  border: 0;
  background: none;
  padding: 4px 0;
  color: var(--accent);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.list { display: flex; flex-direction: column; gap: 10px; }

.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* ---- Panels, text and forms ---- */

.panel {
  margin-top: 12px;
  padding: 18px;
  border-radius: var(--shape);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.panel h2 { font-size: 20px; margin-bottom: 8px; }
.panel h3 { font-size: 16px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.hint.small { font-size: 13px; margin: 12px 0 0; }

.label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.field { display: flex; gap: 8px; }
input[type="url"], input[type="text"], input[type="date"], input[type="datetime-local"], select, textarea {
  flex: 1;
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--shape-btn);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 16px; /* prevents iOS zoom on focus */
}
textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
input[type="url"]:focus, input[type="text"]:focus, input[type="date"]:focus, input[type="datetime-local"]:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
}

.btn {
  padding: 12px 16px;
  border: 0;
  border-radius: var(--shape-btn);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.block { display: block; width: 100%; margin-top: 12px; }
.btn.small { padding: 7px 12px; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:disabled { opacity: 0.6; cursor: default; }

.error {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--shape-btn);
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 14px;
}

.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stack { display: grid; gap: 12px; }
.sub-head { font-size: 16px; margin-top: 8px; }

.advanced summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 4px 0; }
.advanced .hint { margin: 8px 0 10px; }

.check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

/* On/off switch */
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; z-index: 1; margin: 0; opacity: 0; cursor: pointer; }
.switch input:disabled { cursor: default; }
.slider { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 0.2s; }
.slider::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgb(0 0 0 / .3);
  transition: transform 0.2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::after { transform: translateX(18px); }
.switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Pop-up windows ---- */

dialog {
  padding: 0;
  border: 0;
  background: var(--surface);
  color: var(--text);
  overflow: auto;
  overscroll-behavior: contain;
}
dialog::backdrop { background: rgb(0 0 0 / .45); }

/* Most pop-ups fill the screen. The title bar stays at the top while the rest scrolls, and on a
   wide screen the content keeps to a readable width in the middle. */
dialog.dialog-full {
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  border-radius: 0;
  transition: transform 0.22s ease; /* springing back after a pull that didn't close it */
}
dialog.dialog-full.pulling { transition: none; }
@media (prefers-reduced-motion: reduce) {
  dialog.dialog-full { transition: none; }
}
.dialog-full .dialog-body {
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0 var(--gutter) calc(24px + env(safe-area-inset-bottom));
}
.dialog-full .dialog-head {
  position: sticky;
  top: 0;
  z-index: 1;
  align-items: center;
  margin: 0 calc(-1 * var(--gutter));
  padding: calc(10px + env(safe-area-inset-top)) 10px 10px var(--gutter);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.dialog-full .dialog-head h2 { padding-top: 0; }

/* A small box in the middle (size: 'box'), with the rest of the screen dimmed. */
dialog.dialog-box {
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  border-radius: var(--shape);
  box-shadow: 0 20px 60px rgb(0 0 0 / .25);
}
.dialog-body { display: grid; gap: 12px; padding: 18px; }
.dialog-content { display: grid; gap: 12px; }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dialog-head h2 { font-size: 20px; padding-top: 8px; overflow-wrap: anywhere; }
.dialog-body .label { margin: 0 0 -6px; }
.dialog-body .error { margin: 0; }
.dialog-body .hint { margin: 0; }
.dialog-body .hint.small { margin-top: -6px; }
.dialog-body .group { display: grid; gap: 6px; }
.dialog-body .group .label { margin: 6px 0 0; }
.dialog-body .group .label:first-child { margin-top: 0; }
.dialog-body .group .hint.small { margin: 0; }
.advanced .group { margin-top: 10px; }

/* ---- Settings window ---- */

.settings-section { display: grid; gap: 12px; }
.settings-section + .settings-section { padding-top: 16px; border-top: 1px solid var(--line); }
.settings-section .sub-head { margin-top: 0; }
.features-fold summary { font-size: 16px; }
.features-fold summary small { float: right; padding-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
.features-fold[open] summary { margin-bottom: 8px; }
.feature-list { display: grid; }
.feature-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.feature-row:last-child { border-bottom: 0; }
.feature-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.feature-text small { font-size: 13px; color: var(--muted); }
.feature-row.off .feature-text { opacity: 0.6; }
.problems { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

/* ---- Message at the bottom ---- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom)); /* above the tab bar */
  z-index: 50;
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border-radius: var(--shape-btn);
  background: var(--text);
  color: var(--bg);
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 8px);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .icon-btn.spin svg, .menu-row.spin svg { animation: none; }
  .tabbar, .tab-track, .tab-pill, .tab { transition: none; }
  .menu-panel, .menu-drawer::backdrop { transition: none; }
  .toast { transition: none; }
}

/* ---- Theme from app/app.json ---- */
:root { --accent: #5c5f66; }
@media (prefers-color-scheme: dark) { :root { --accent: #b4b7bd; } }

/* ---- app/theme.css ---- */
/* A grey theme: Folio's colours made neutral (its own are slightly blue), then the renderer's
   own colour names. Components use only these and Folio's names. The accent is in app/app.json. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #ebebed;
  --text: #1b1b1d;
  --muted: #66666c;
  --line: #dedee1;
  --accent-soft: #e7e7ea;
  --top: #2a2a2d;
  --top-2: #333336;
  --on-top-muted: #c6c6ca;

  --renderer-anchor: #d93025;   /* the anchor's crosshair on the picture */
  --renderer-contour: #ec7a12;  /* the threshold line on the Field view */
  --renderer-pass: #1d6b3c;
  --renderer-pass-soft: #e2f4e8;
  --renderer-fail: #a3201a;
  --renderer-fail-soft: #fce4e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111112;
    --surface: #1b1b1d;
    --surface-2: #262628;
    --text: #e9e9eb;
    --muted: #a0a0a6;
    --line: #313134;
    --accent-ink: #111112;
    --accent-soft: #2c2c30;
    --top: #0c0c0d;
    --top-2: #151517;

    --renderer-anchor: #ff6b5e;
    --renderer-contour: #ffa64d;
    --renderer-pass: #8fd9a8;
    --renderer-pass-soft: #1d3a27;
    --renderer-fail: #ff9a90;
    --renderer-fail-soft: #43201d;
  }
}

/* ---- feature: account (style.css) ---- */
.account-page .dialog-content { display: flex; flex-direction: column; gap: 12px; }
.account-page p { margin: 0; }
.account-who { display: flex; align-items: center; gap: 12px; }
.account-who > div { display: flex; flex-direction: column; min-width: 0; }
.account-who small { opacity: 0.7; overflow-wrap: anywhere; }
.account-photo { width: 40px; height: 40px; border-radius: 50%; }
.account-error { color: var(--danger); }

/* ---- feature: home (style.css) ---- */
/* Styles for Home. Class names start with "home-". The words sit on the paper, so they use
   their own ink, the same in light and dark mode (the picture doesn't change with the mode). */

:root {
  --home-ink: #2b2a28;
  --home-font: "Tenor Sans", sans-serif;
}

/* The page over the picture: the name in the middle, a little above centre. Only the words
   take clicks, so the picture underneath still can (e.g. moving the anchor). */
.home {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(28px, 5vh, 56px);
  padding: 0 24px 6vh;
  pointer-events: none;
  color: var(--home-ink);
  font-family: var(--home-font);
  text-align: center;
}
.home-font-loading .home { visibility: hidden; } /* no flash of the fallback face */

.home-title {
  margin: 0;
  font-family: inherit;
  font-weight: 400;
  font-size: clamp(36px, 8vw, 104px);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  /* Letter spacing adds space after the last letter too; this keeps the word truly centred. */
  margin-right: -0.12em;
  opacity: 0.88;
}

.home-nav { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.home-row { display: flex; gap: clamp(28px, 4vw, 48px); }

/* Plain words, not buttons: no fill, no border, no shadow. A hairline appears under the word
   on hover or focus. */
.home-link {
  pointer-events: auto;
  appearance: none;
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  margin: 0;
  padding: 6px 2px;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.22em;
  margin-right: -0.22em;
  text-transform: uppercase;
  color: inherit;
  opacity: 0.62;
  cursor: pointer;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity 0.2s, background-size 0.25s;
  -webkit-tap-highlight-color: transparent;
}
.home-link.home-create { font-size: 25px; opacity: 0.8; }
.home-link:hover, .home-link:focus-visible { opacity: 1; background-size: calc(100% - 4px - 0.22em) 1px; outline: none; }

/* The top bar: only the menu button, as the three lines alone at 80% opacity. */
.topbar .top-btn {
  background: none;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: var(--home-ink);
  opacity: 0.8;
}
.topbar .top-btn:hover { opacity: 1; }
.topbar .top-right { display: none; }

/* Settings → Typeface: each choice in its own face. */
.home-fonts button, .home-fonts button[aria-selected="true"] { font-size: 15px; font-weight: 400; }

/* ---- The menu: "Veil" ----
   No panel and no dark backdrop: when the menu opens the light comes up, the page goes pale and
   soft-focus behind a veil, and the words stand on the left in the home page's type. Who is
   signed in sits small at the bottom. The three lines become a thin cross in the same place.
   Folio's Menu still opens and closes it (tap the empty veil, Escape, back, swipe left);
   this only restyles it. Closing must finish within Menu.js's SLIDE_MS (280ms). */
:root {
  --veil-glow: rgb(255 253 248 / .78);
  --veil-mid: rgb(250 247 240 / .55);
  --veil-far: rgb(250 247 240 / .38);
}
dialog.menu-drawer { background: transparent; color: var(--home-ink); font-family: var(--home-font); }
.menu-drawer::backdrop { background: transparent; }
dialog.menu-drawer::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(90% 80% at 18% 50%, var(--veil-glow), var(--veil-mid) 60%, var(--veil-far));
  -webkit-backdrop-filter: blur(14px) saturate(.9);
  backdrop-filter: blur(14px) saturate(.9);
  opacity: 0;
  transition: opacity .25s ease;
}
.menu-drawer.shown::before { opacity: 1; transition: opacity .7s cubic-bezier(.22, .7, .18, 1); }

.menu-drawer .menu-panel {
  position: relative;
  width: 100%;
  border-radius: 0;
  background: none;
  box-shadow: none;
  color: inherit;
  transform: none;
  justify-content: center;
  padding: calc(84px + env(safe-area-inset-top)) var(--gutter) calc(120px + env(safe-area-inset-bottom));
  padding-left: calc(var(--gutter) + 12px);
}
/* The cross, where the three lines were. Tapping it (or any empty part) closes the menu. */
.menu-drawer .menu-panel::before, .menu-drawer .menu-panel::after {
  content: "";
  position: absolute;
  top: calc(10px + env(safe-area-inset-top) + 21.4px);
  left: calc(var(--gutter) + 12px);
  width: 20px;
  height: 1.25px;
  border-radius: 1px;
  background: var(--home-ink);
  opacity: 0;
  transition: transform .25s ease, opacity .2s;
  pointer-events: none;
}
.menu-drawer.shown .menu-panel::before, .menu-drawer.shown .menu-panel::after {
  opacity: .8;
  transition: transform .5s cubic-bezier(.22, .7, .18, 1), opacity .3s;
}
.menu-drawer.shown .menu-panel::before { transform: rotate(45deg); }
.menu-drawer.shown .menu-panel::after { transform: rotate(-45deg); }

.menu-drawer .menu-list { display: grid; justify-items: start; gap: clamp(18px, 3.2vh, 30px); padding: 0; }
.menu-drawer .menu-row {
  padding: 6px 2px;
  border: 0;
  border-radius: 0;
  color: inherit;
  font: inherit;
  font-size: clamp(20px, 2.4vw, 26px);
  letter-spacing: .26em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(8px);
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 2px 100%;
  background-size: 0 1px;
  transition: opacity .2s, transform .25s, background-size .3s;
  -webkit-tap-highlight-color: transparent;
}
.menu-drawer .menu-row svg { display: none; }
.menu-drawer.shown .menu-row {
  opacity: .7;
  transform: none;
  transition: opacity .5s cubic-bezier(.22, .7, .18, 1), transform .7s cubic-bezier(.22, .7, .18, 1), background-size .3s;
}
.menu-drawer.shown .menu-row:nth-child(1) { transition-delay: .10s, .10s, 0s; }
.menu-drawer.shown .menu-row:nth-child(2) { transition-delay: .17s, .17s, 0s; }
.menu-drawer.shown .menu-row:nth-child(3) { transition-delay: .24s, .24s, 0s; }
.menu-drawer.shown .menu-row:nth-child(4) { transition-delay: .31s, .31s, 0s; }
.menu-drawer.shown .menu-row:nth-child(n+5) { transition-delay: .38s, .38s, 0s; }
.menu-drawer .menu-row:hover, .menu-drawer .menu-row:focus-visible {
  opacity: 1;
  outline: none;
  background-size: calc(100% - 4px - .26em) 1px;
}

/* Who is signed in: small, at the bottom left, under a short hairline. */
.menu-drawer .menu-top {
  position: absolute;
  left: calc(var(--gutter) + 14px);
  bottom: calc(56px + env(safe-area-inset-bottom));
  width: auto;
  padding: 18px 0 4px;
  display: grid;
  background: none;
  color: inherit;
  opacity: 0;
  transition: opacity .25s;
}
.menu-drawer.shown .menu-top { opacity: .5; transition: opacity .6s .38s; }
.menu-drawer .menu-top:hover, .menu-drawer .menu-top:focus-visible { opacity: .8; outline: none; }
.menu-drawer .menu-top::before { content: ""; position: absolute; top: 0; left: 0; width: 36px; height: 1px; background: currentColor; opacity: .5; }
.menu-drawer .menu-avatar { display: none; }
.menu-drawer .menu-who { gap: 6px; }
.menu-drawer .menu-who b, .menu-drawer .menu-who small {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: inherit;
}

@media (prefers-reduced-motion: reduce) {
  .home-link { transition: none; }
  .menu-drawer .menu-row, .menu-drawer .menu-top, dialog.menu-drawer::before,
  .menu-drawer .menu-panel::before, .menu-drawer .menu-panel::after { transition: none !important; transform: none; }
  .menu-drawer.shown .menu-panel::before { transform: rotate(45deg); }
  .menu-drawer.shown .menu-panel::after { transform: rotate(-45deg); }
}

/* ---- feature: renderer (style.css) ---- */
/* Styles for Renderer. Class names start with "renderer-". Colours come from app/theme.css. */

.renderer-page { display: grid; gap: 12px; }

/* Seven views don't fit in one row in the Settings window: two rows of four. */
.renderer-tabs { grid-template-columns: repeat(4, 1fr); }

/* Advanced, in Settings: the tools folded into groups */
.renderer-advanced { display: grid; gap: 4px; }
.renderer-advanced > .hint.small { margin: 0 0 4px; }
.renderer-advanced > .btn { justify-self: start; margin-top: 8px; }
.renderer-fold { border-top: 1px solid var(--line); padding: 6px 0; }
.renderer-fold summary { padding: 6px 0; }
.renderer-fold-body { display: grid; gap: 12px; padding: 8px 0 6px; }
.renderer-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.renderer-fold-body .hint.small { margin: 0; }
.renderer-marks { font-size: 14px; }

/* The picture fills the screen edge to edge, behind the (invisible) top bar, cropped to fit. */
.renderer-stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--surface-2);
}
.renderer-stage.marked { cursor: crosshair; }
.renderer-stage[hidden] { display: none; }
.renderer-page > .error { position: relative; z-index: 1; }
.renderer-canvas, .renderer-overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.renderer-canvas { object-fit: cover; }
.renderer-overlay { pointer-events: none; }

.renderer-seed { margin: 0; color: var(--muted); font-size: 13px; }
.renderer-seed code { font-family: var(--font-mono); color: var(--text); }

.renderer-report h3 { margin: 4px 0; font-size: 15px; }
.renderer-report p { margin: 0 0 8px; font-size: 14px; color: var(--text-2); }
.renderer-attempt { border-top: 1px solid var(--line); padding: 6px 0; font-size: 13px; }
.renderer-attempt summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); }
.renderer-attempt ul { margin: 6px 0 2px; padding-left: 18px; color: var(--text-2); }
.renderer-tag { padding: 1px 7px; border-radius: var(--shape-sm); font-family: var(--font); font-size: 12px; background: var(--surface-2); color: var(--muted); }
.renderer-tag.pass { background: var(--renderer-pass-soft); color: var(--renderer-pass); }
.renderer-tag.fail { background: var(--renderer-fail-soft); color: var(--renderer-fail); }
.renderer-tag.kept { background: var(--accent); color: var(--accent-ink); }

.renderer-sliders { display: grid; gap: 12px; }
.renderer-group { margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: var(--shape); background: var(--surface); display: grid; gap: 8px; }
.renderer-group legend { padding: 0 4px; font-weight: 600; font-size: 13px; }
.renderer-slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; color: var(--text-2); }
.renderer-slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.renderer-value { font-family: var(--font-mono); color: var(--text); }
.renderer-colour input { grid-column: auto; width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: var(--shape-sm); background: none; }

/* The Plain theme's glow: a small canvas, scaled up by the browser and screen-blended over the picture. */
.renderer-glow { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; mix-blend-mode: screen; }
.renderer-glow[hidden] { display: none; }
.renderer-tabs.plain { grid-template-columns: repeat(4, 1fr); }
.renderer-tabs[hidden], .renderer-fold[hidden], .renderer-marks[hidden] { display: none; }
.renderer-dyes { grid-column: 1 / -1; }

</style>
