# Builds the Windows desktop app (desktop/, Tauri 2) from the same one-file page as the web copy.
# - On a pull request that touches the shell: builds the installer and attaches it to the run
#   as a download ("traumerei-windows"), so it can be installed before merging.
# - On a tag v*: builds it and puts the installer on a draft GitHub Release for that tag.
name: Desktop app

on:
  pull_request:
    paths: ['desktop/**', 'standalone.py', '.github/workflows/release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: The tag and the three versions agree
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: python
        run: |
          import json, re, sys
          tag = "${{ github.ref_name }}".lstrip('v')
          app = json.load(open('app/app.json', encoding='utf-8'))['version']
          conf = json.load(open('desktop/src-tauri/tauri.conf.json', encoding='utf-8'))['version']
          cargo = re.search(r'^version = "(.+?)"', open('desktop/src-tauri/Cargo.toml', encoding='utf-8').read(), re.M).group(1)
          print(f'tag {tag}, app.json {app}, tauri.conf.json {conf}, Cargo.toml {cargo}')
          if len({tag, app, conf, cargo}) != 1: sys.exit('::error::Set the same version in app/app.json, tauri.conf.json and Cargo.toml as the tag.')
      - name: Build the one-file page for the app
        run: python standalone.py --desktop
      - name: Install the Tauri command line
        working-directory: desktop
        run: npm ci
      - name: Build the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: desktop
        run: npx tauri build
      - name: Attach it as a download
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: traumerei-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
      - name: Link it in the summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          echo "### Try the desktop app" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download traumerei-windows](${{ steps.upload.outputs.artifact-url }}), unzip it and run the setup .exe." >> "$GITHUB_STEP_SUMMARY"
      - name: Build it onto a draft Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Träumerei ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
